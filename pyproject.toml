[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "nrc-to-jpg"
version = "2026.1.0"
description = "Save the NRC front page to a JPG image."
authors = [{name = "Steven van de Graaf", email = "steven@vandegraaf.xyz"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.11, <4"
dependencies = [
    "click",
    "httpx2",
]

[dependency-groups]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinxext-opengraph",
]
tests = [
    "pytest",
    "pytest-cov",
]
typing = [
    "mypy",
    "pyrefly",
    "pyright[nodejs]",
    "ty",
    "zuban",
]
dev = [
    { include-group = "docs" },
    { include-group = "tests" },
    { include-group = "typing" },
    "cogapp",
    "prek",
]

[project.urls]
Documentation = "https://nrc-to-jpg.readthedocs.io/en/stable/"
Changelog = "https://nrc-to-jpg.readthedocs.io/en/stable/changelog.html"
"Source Code" = "https://github.com/sgraaf/nrc-to-jpg"
"Issue Tracker" = "https://github.com/sgraaf/nrc-to-jpg/issues"

[project.scripts]
nrc-to-jpg = "nrc_to_jpg.__main__:cli"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma (flake8-commas), handled by the formatter
    "CPY001",  # missing-copyright-notice (flake8-copyright)
    "D102",  # undocumented-public-method (pydocstyle)
    "D105",  # undocumented-magic-method (pydocstyle)
    "D107",  # undocumented-public-init (pydocstyle)
    "E501",  # line-too-long (pycodestyle), handled by the formatter
    "PLC2401",  # non-ascii-name (Pylint)
    "S101",   # assert (flake8-bandit)
    "SLF001",  # private-member-access (flake8-self)
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # unused-import (Pyflakes)
]
"docs/conf.py" = [
    "INP001",  # implicit-namespace-package (flake8-no-pep420)
]
"src/nrc_to_jpg/cli.py" = [
    "A001",  # builtin-variable-shadowing (flake8-builtins)
    "A002",  # builtin-argument-shadowing (flake8-builtins)
    "C901",  # complex-structure (mccabe)
    "FBT001",  # boolean-type-hint-positional-argument (flake8-boolean-trap)
    "PLR0913",  # too-many-arguments (Pylint)
]
"tests/**/test_*.py" = [
    "D",  # pydocstyle
    "PLR2004",   # magic-value-comparison (Pylint)
    "S101",   # assert (flake8-bandit)
    "SIM300",   # yoda-conditions (flake8-simplify)
]
"tests/smoke_test.py" = [
    "D",  # pydocstyle
    "PLR2004",   # magic-value-comparison (Pylint)
    "S101",  # assert (flake8-bandit)
]
"tests/utils.py" = [
    "ANN401",  # any-type (flake8-annotations)
]

[tool.ty.src]
include = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["tests"]

[tool.pyrefly]
project-includes = ["tests"]
search-path = ["tests"]

[tool.pyright]
include = ["tests"]
pythonVersion = "3.11"

[tool.zuban]
python_version = "3.11"
files = ["tests"]
